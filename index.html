<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Endless Runner · Taller PWA</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA: manifiesto, color de la barra y soporte para iPhone -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runner">
</head>
<body>
  <main id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="hud">
      <span id="score">Puntos: 0</span>
      <span id="best">Récord: 0</span>
      <button id="restartBtn" hidden>Reintentar</button>
    </div>
    <section id="background-controls" aria-label="Personalizar fondo">
      <div class="background-buttons">
        <button id="colorBackgroundBtn" type="button" aria-expanded="false" aria-controls="colorOptions">Fondo 1</button>
        <button id="imageBackgroundBtn" type="button" aria-expanded="false" aria-controls="imageOptions">Fondo 2</button>
      </div>
      <div id="colorOptions" class="background-options" hidden>
        <span>Elige un color:</span>
        <div class="color-options">
          <button type="button" class="color-option" data-color="rgb(122, 137, 162)" aria-label="Gris azulado" aria-pressed="true">
            <span class="color-swatch" style="--swatch-color: rgb(122, 137, 162)"></span>Gris azulado
          </button>
          <button type="button" class="color-option" data-color="rgb(15, 23, 42)" aria-label="Azul noche" aria-pressed="false">
            <span class="color-swatch" style="--swatch-color: rgb(15, 23, 42)"></span>Azul noche
          </button>
          <button type="button" class="color-option" data-color="rgb(56, 189, 248)" aria-label="Celeste" aria-pressed="false">
            <span class="color-swatch" style="--swatch-color: rgb(56, 189, 248)"></span>Celeste
          </button>
          <button type="button" class="color-option" data-color="rgb(34, 197, 94)" aria-label="Verde" aria-pressed="false">
            <span class="color-swatch" style="--swatch-color: rgb(34, 197, 94)"></span>Verde
          </button>
          <button type="button" class="color-option" data-color="rgb(250, 204, 21)" aria-label="Amarillo" aria-pressed="false">
            <span class="color-swatch" style="--swatch-color: rgb(250, 204, 21)"></span>Amarillo
          </button>
          <button type="button" class="color-option" data-color="rgb(248, 113, 113)" aria-label="Coral" aria-pressed="false">
            <span class="color-swatch" style="--swatch-color: rgb(248, 113, 113)"></span>Coral
          </button>
        </div>
      </div>
      <div id="imageOptions" class="background-options" hidden>
        <label for="backgroundImageInput">Importa una imagen para usarla como fondo:</label>
        <input id="backgroundImageInput" type="file" accept="image/*">
        <p id="backgroundImageStatus" role="status" aria-live="polite"></p>
      </div>
    </section>
    <p id="instructions">Toca la pantalla o presiona <strong>Espacio</strong> para saltar</p>
  </main>

  <script src="game.js"></script>

  <!-- COMPLETA (Paso 7): quita las marcas de comentario de las líneas de abajo
       (las que dicen  /*  y  */ ) para registrar el service worker. -->
  <script>
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('✅ Service Worker registrado'))
          .catch(err => console.error('❌ Error al registrar el SW:', err));
      });
    }
    
  </script>
</body>
</html>
